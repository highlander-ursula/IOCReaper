<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IOCReaper - IOC Extractor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">IOCReaper</h1>
        <p class="text-center text-muted">Extract Indicators of Compromise from raw text</p>
        
        <!-- Input Section -->
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">Input Text</h5>
                <form id="extractForm">
                    <textarea class="form-control mb-3" id="inputText" rows="10" 
                              placeholder="Paste your threat intelligence report here..."></textarea>
                    
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" id="normalize">
                        <label class="form-check-label" for="normalize">
                            Normalize IOCs (defang/refang)
                        </label>
                    </div>
                    
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="deduplicate" checked>
                        <label class="form-check-label" for="deduplicate">
                            Deduplicate results
                        </label>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">Extract IOCs</button>
                    <button type="button" class="btn btn-secondary" id="clearBtn">Clear</button>
                </form>
            </div>
        </div>
        
        <!-- Results Section -->
        <div id="resultsSection" style="display:none;">
            <div class="card mb-4">
                <div class="card-body">
                    <h5 class="card-title">Extracted IOCs</h5>
                    
                    <!-- Search Bar -->
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" id="searchInput" placeholder="Search IOCs or tags...">
                        <button class="btn btn-outline-secondary" type="button" id="searchBtn">Search</button>
                    </div>
                    
                    <!-- Action Buttons -->
                    <div class="btn-group mb-3" role="group">
                        <button type="button" class="btn btn-success" id="copyBtn">Copy All</button>
                        <div class="btn-group" role="group">
                            <button type="button" class="btn btn-info dropdown-toggle" data-bs-toggle="dropdown">
                                Export
                            </button>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item export-btn" data-format="json" href="#">JSON</a></li>
                                <li><a class="dropdown-item export-btn" data-format="csv" href="#">CSV</a></li>
                                <li><a class="dropdown-item export-btn" data-format="txt" href="#">TXT</a></li>
                            </ul>
                        </div>
                    </div>
                    
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="includeTags">
                        <label class="form-check-label" for="includeTags">
                            Include tags in export
                        </label>
                    </div>
                    
                    <!-- Tabs for IOC Types -->
                    <ul class="nav nav-tabs" id="iocTabs" role="tablist"></ul>
                    <div class="tab-content" id="iocTabContent"></div>
                </div>
            </div>
        </div>
        
        <!-- Alert Container -->
        <div id="alertContainer"></div>
    </div>
    
    <!-- Tag Modal -->
    <div class="modal fade" id="tagModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add Tag</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="tagIocValue">
                    <input type="text" class="form-control" id="tagInput" placeholder="Enter tag...">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveTagBtn">Save Tag</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
