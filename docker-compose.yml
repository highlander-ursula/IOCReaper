version: '3.8'

services:
  iocreaper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iocreaper
    image: iocreaper:phase5
    ports:
      - "8000:8000"
    volumes:
      # Mount logs directory to persist logs
      - ./logs:/app/logs
    environment:
      - APP_NAME=IOCReaper
      - APP_VERSION=2.0.0
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    restart: unless-stopped
    networks:
      - iocreaper-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    read_only: false
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

networks:
  iocreaper-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
