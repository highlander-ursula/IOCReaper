<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="description" content="IOCReaper - IOC Extraction and Analysis Tool">
    <meta name="author" content="Manudeep Maddipatla">
    
    <title>IOCReaper - IOC Extraction Tool</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">🔍 IOCReaper</span>
            <span class="navbar-text text-light">
                <small>Author: Manudeep Maddipatla | UMD ENPM680</small>
            </span>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Alert Container -->
        <div id="alertContainer" class="alert-container"></div>

        <!-- Input Section -->
        <div class="card mb-4">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">📝 Extract IOCs from Text</h5>
            </div>
            <div class="card-body">
                <form id="extractForm">
                    <div class="mb-3">
                        <label for="inputText" class="form-label">Paste your threat intelligence text here:</label>
                        <textarea class="form-control" id="inputText" rows="8" 
                                  placeholder="Example: Contact admin@evil-domain.com or visit https://malicious-site.com. Malware hash: 5d41402abc4b2a76b9719d911017c592"></textarea>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="normalize" checked>
                                <label class="form-check-label" for="normalize">
                                    Normalize IOCs (defang to fang)
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="deduplicate" checked>
                                <label class="form-check-label" for="deduplicate">
                                    Remove duplicates
                                </label>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mt-3">
                        <button type="submit" class="btn btn-primary">
                            <span>🔍 Extract IOCs</span>
                        </button>
                        <button type="button" class="btn btn-danger" id="clearBtn">
                            <span>🗑️ Clear All</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Results Section -->
        <div id="resultsSection" class="card" style="display: none;">
            <div class="card-header bg-success text-white">
                <h5 class="mb-0">✅ Extracted IOCs</h5>
            </div>
            <div class="card-body">
                <!-- Search and Actions -->
                <div class="row mb-3">
                    <div class="col-md-6">
                        <div class="input-group">
                            <input type="text" class="form-control" id="searchInput" placeholder="Search IOCs...">
                            <button class="btn btn-outline-primary" id="searchBtn">🔍 Search</button>
                        </div>
                    </div>
                    <div class="col-md-6 text-end">
                        <button class="btn btn-outline-secondary" id="copyBtn">📋 Copy All</button>
                        <div class="btn-group" role="group">
                            <button type="button" class="btn btn-outline-success dropdown-toggle" data-bs-toggle="dropdown">
                                💾 Export
                            </button>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item export-btn" href="#" data-format="json">JSON</a></li>
                                <li><a class="dropdown-item export-btn" href="#" data-format="csv">CSV</a></li>
                                <li><a class="dropdown-item export-btn" href="#" data-format="txt">TXT</a></li>
                            </ul>
                        </div>
                    </div>
                </div>

                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="includeTags" checked>
                    <label class="form-check-label" for="includeTags">
                        Include tags in export
                    </label>
                </div>

                <!-- IOC Tabs -->
                <ul class="nav nav-tabs" id="iocTabs" role="tablist"></ul>
                
                <!-- Tab Content -->
                <div class="tab-content mt-3" id="iocTabContent"></div>
            </div>
        </div>
    </div>

    <!-- Tag Modal -->
    <div class="modal fade" id="tagModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">🏷️ Add Tag</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="tagIocValue">
                    <div class="mb-3">
                        <label for="tagInput" class="form-label">Tag:</label>
                        <input type="text" class="form-control" id="tagInput" placeholder="e.g., malware, phishing, c2">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveTagBtn">Save Tag</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="mt-5 py-3 bg-light">
        <div class="container text-center">
            <p class="mb-0">
                <strong>IOCReaper</strong> | 
                ENPM680 Project | 
                Manudeep Maddipatla (mmaddipa@umd.edu)
            </p>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JavaScript - IOCReaper Application -->
    <script src="/static/js/app.js"></script>
</body>
</html>
